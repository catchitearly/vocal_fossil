<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal Art | Unicorn Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
</head>
<body>
    <div id="controls">
        <h1>Vocal Magic</h1>
        <p id="themeDisplay">Press & Hold to Create</p>
        <div id="progressContainer" style="width:100%; height:4px; background:#eee; margin-bottom:15px; border-radius:2px; display:none;">
            <div id="progressBar" style="width:0%; height:100%; background:linear-gradient(90deg, #ff7eb3, #845ef7); border-radius:2px;"></div>
        </div>
        <button id="startBtn">HOLD TO RECORD</button>
        <div class="btn-group" style="margin-top:10px;">
            <button id="shareBtn" style="display:none;">Share Art</button>
            <button id="saveBtn">Save Print</button>
        </div>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
